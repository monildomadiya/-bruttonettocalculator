name: Deploy

on:
  push:
    branches:
      - main
  # Manual redeploy without a new commit (`gh workflow run Deploy`); a plain
  # re-run needs repo admin rights.
  workflow_dispatch:

# Single target: the Azure VM. Never let two runs overlap.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  # ── Azure VM ────────────────────────────────────────────────────────
  # The only deploy target. The DigitalOcean droplet job was removed on
  # 2026-09-24: the droplet had stopped accepting SSH (timeouts on every
  # run since 2026-09-23) and no longer serves this site.
  azure:
    name: Azure VM
    runs-on: ubuntu-latest
    # Optional — the purge step below only runs once both secrets exist.
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}

    steps:
      # Staged deploy (2026-10-26). Until then the build ran *inside* the live
      # directory: `npm ci` deleted node_modules and `next build` emptied .next
      # under the running server. On 26.10. a build stalled (0 % CPU, ssh
      # timeout after 10 min), .next was left without a BUILD_ID, and the next
      # restart crash-looped for ~2 min. Now everything happens in a staging
      # copy; the live directory is only swapped once the new build has
      # booted and answered on a spare port.
      - name: Deploy over SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: ${{ secrets.AZURE_USERNAME }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          port: 22
          # Must exceed npm ci + two build attempts + smoke test below.
          command_timeout: 45m
          script: |
            set -eu
            APP=/var/www/bruttonetto
            STAGE=/var/www/bruttonetto.stage
            PREV=/var/www/bruttonetto.prev
            SMOKE_PORT=3017

            # ── 1. Staging copy ── source + .env + git config, but neither
            # node_modules nor the build. The build cache is carried over so
            # webpack doesn't start cold.
            rm -rf "$STAGE"
            mkdir -p "$STAGE/.next"
            rsync -a --exclude node_modules --exclude .next "$APP/" "$STAGE/"
            [ -d "$APP/.next/cache" ] && cp -a "$APP/.next/cache" "$STAGE/.next/" || true
            cd "$STAGE"

            # This checkout was created with a shallow fetch, so pull the
            # same way rather than assuming a tracking branch exists.
            # .env is gitignored, so a hard reset never touches it.
            git fetch --depth=1 origin main
            git reset --hard FETCH_HEAD

            timeout 10m npm ci --no-audit --no-fund

            # 2 vCPU / 4 GB, with 4 GB of swap behind it. A normal build takes
            # ~2 min; the 26.10. stall never finished, so cap each attempt and
            # retry once.
            build() { NODE_OPTIONS="--max-old-space-size=3072" timeout 15m npm run build; }
            build || { echo "build failed or timed out, retrying once"; build; }
            test -f .next/BUILD_ID

            # ── 2. Smoke test ── boot the new build next to the live one.
            node_modules/.bin/next start -p "$SMOKE_PORT" > /tmp/deploy-smoke.log 2>&1 &
            SMOKE_PID=$!
            ok=""
            for i in $(seq 1 30); do
              if curl -fsS -o /dev/null "http://127.0.0.1:$SMOKE_PORT/" \
                && curl -fsS -o /dev/null "http://127.0.0.1:$SMOKE_PORT/krankenkasse/tk"; then
                ok=1; break
              fi
              sleep 2
            done
            kill "$SMOKE_PID" 2>/dev/null || true
            sleep 2
            fuser -k "$SMOKE_PORT/tcp" 2>/dev/null || true
            if [ -z "$ok" ]; then
              echo "smoke test failed, live site untouched"
              tail -50 /tmp/deploy-smoke.log
              exit 1
            fi

            # ── 3. Swap ── two renames on the same filesystem. The running
            # server keeps its files (its cwd moves with the old directory)
            # until pm2 restarts it from the new one.
            rm -rf "$PREV"
            mv "$APP" "$PREV"
            mv "$STAGE" "$APP"
            cd "$APP"

            # Restart in place rather than delete+start, so the port never
            # goes unbound and a deploy is not a visible outage.
            pm2 restart bruttonetto_live --update-env \
              || pm2 start node_modules/.bin/next --name "bruttonetto_live" -- start -p 3007

            ok=""
            for i in $(seq 1 15); do
              curl -fsS -o /dev/null http://127.0.0.1:3007/ && { ok=1; break; }
              sleep 2
            done
            if [ -z "$ok" ]; then
              echo "new build not answering on 3007, rolling back"
              rm -rf "$STAGE" && mv "$APP" "$STAGE" && mv "$PREV" "$APP"
              cd "$APP" && pm2 restart bruttonetto_live --update-env
              exit 1
            fi
            pm2 save
            pm2 status
            curl -fsS -o /dev/null -w 'local check: %{http_code}\n' http://127.0.0.1:3007/

      # ── Cloudflare purge ──────────────────────────────────────────────
      # Prerequisite for an HTML Cache Rule in Cloudflare (today every page is
      # `cf-cache-status: DYNAMIC`, ~1,1–1,4 s TTFB from Germany). Once HTML is
      # cached at the edge, a deploy MUST purge it: cached pages reference the
      # previous build's /_next/static chunk hashes, which no longer exist after
      # `npm run build`, so stale HTML would load without its JavaScript.
      # Token needs only "Zone → Cache Purge → Purge" on this zone.
      - name: Purge Cloudflare cache
        if: ${{ env.CF_API_TOKEN != '' && env.CF_ZONE_ID != '' }}
        run: |
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" -H "Authorization: Bearer ${CF_API_TOKEN}" -H "Content-Type: application/json" --data '{"purge_everything":true}'
